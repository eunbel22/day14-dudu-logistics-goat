<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두두택배 - 관리자</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css">
<!--
  두두택배 관리자 페이지 (admin.html)
  =================================================
  index.html(고객 접수), receipt.html(영수증 조회)과 같은 구조로
  common.js/styles.css를 공유한다. 관리자 전용 로직만 admin.js에.

  보안 주의 - admin.js 상단 주석 참고. 접근 코드는 UX용 가림막일
  뿐이고, 실제 데이터 접근 통제는 Supabase RLS 정책이 하는데 지금은
  anon에게 SELECT가 전부 열려 있어서 이 페이지 없이도 데이터 조회가
  가능하다. 진짜 관리자 전용으로 만들려면 Supabase Auth 로그인을
  붙이고 RLS를 authenticated + 직원 여부로 좁혀야 한다.
-->
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="brand-link" href="index.html">
      <div class="brand">두두택배</div>
      <div class="sub">관리자 - 접수 현황 조회</div>
    </a>
  </div>

  <div class="card-shell">

    <!-- 접근 코드 게이트 -->
    <div class="admin-gate" id="adminGate">
      <div class="gate-icon">🔒</div>
      <h2 style="margin:0 0 6px;">관리자 접근 코드</h2>
      <p class="step-desc">지점 직원만 아는 코드를 입력하세요.</p>
      <input type="password" id="gatePasscodeInput" placeholder="••••" maxlength="10" autofocus>
      <div class="gate-error" id="gateError"></div>
      <div class="btn-row" style="position:static; padding-top:16px;">
        <button type="button" class="submit-btn" onclick="checkPasscode()">확인</button>
      </div>
      <p class="gate-warning">이 코드는 화면 접근을 가리는 용도이며, 실제 데이터 보안은 아닙니다. 자세한 내용은 이 파일의 소스 주석을 참고하세요.</p>
    </div>

    <!-- 관리자 패널 -->
    <div class="admin-panel" id="adminPanel" hidden>

      <div class="stat-cards" id="statCards"></div>

      <div class="admin-filter-bar">
        <select id="branchFilterSelect" onchange="onBranchFilterChange()"></select>
        <div class="filter-chip-row" id="periodChips"></div>
        <input type="text" id="searchInput" placeholder="운송장번호・이름 검색" oninput="onSearchInput()">
        <button type="button" class="admin-export-btn" onclick="exportCSV()">CSV 다운로드</button>
      </div>

      <div class="admin-table-wrap">
        <table>
          <thead>
            <tr>
              <th>운송장</th><th>지점</th><th>접수시각</th><th>보내는분</th><th>받는분</th>
              <th>도착지역</th><th>권역</th><th>물품</th><th>요금무게</th><th>등급</th><th>요금</th><th>도착예정</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"><tr class="empty-row"><td colspan="12">불러오는 중...</td></tr></tbody>
        </table>
      </div>

      <div class="btn-row" style="position:static; padding-top:20px; max-width: 200px;">
        <button type="button" class="nav-btn prev" onclick="logoutAdmin()">로그아웃</button>
      </div>
    </div>

  </div>
</div>

<div class="site-footer">
  <div><b>두두택배</b> 관리자 전용 페이지 - 고객에게 이 링크를 공유하지 마세요.</div>
  <div class="footer-links"><a href="index.html">접수 화면으로</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
